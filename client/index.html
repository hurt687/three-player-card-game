<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三人卡牌游戏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="logo">♠ ♥ ♦ ♣</div>
    <h1>三人卡牌游戏</h1>
    <p class="subtitle">第一版联机大厅</p>
    <div class="status" id="status">正在连接服务器…</div>
    <section class="room">
      <div class="room-title">当前房间</div>
      <div class="players" id="players">等待连接</div>
      <div class="hint">打开这个页面的朋友会自动加入房间</div>
    </section>
    <p class="next">下一步：加入54张牌、自动发牌和出牌按钮。</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
